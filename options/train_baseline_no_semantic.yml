# AURA Baseline配置（不使用预训练语义编码器）
# 用于对比实验

name: AURA_baseline_no_semantic
model_type: UPSRRealModel
scale: 4
num_gpu: auto
manual_seed: 0

# 数据集配置（与语义版本相同）
datasets:
  train:
    name: RealSR
    type: RealSRDataset
    dataroot_gt: /path/to/RealSR/train/HR
    dataroot_lq: /path/to/RealSR/train/LR
    io_backend:
      type: disk
    
    use_hflip: true
    use_rot: true
    
    num_worker_per_gpu: 8
    batch_size_per_gpu: 2
    micro_batchsize: 1
    dataset_enlarge_ratio: 1
    prefetch_mode: ~

  val:
    name: RealSR_Val
    type: RealSRDataset
    dataroot_gt: /path/to/RealSR/val/HR
    dataroot_lq: /path/to/RealSR/val/LR
    io_backend:
      type: disk
    
    desired_min_size: 256
    chop_size: 512
    chop_stride: 256
    chop_bs: 1
    noise_repeat: false

# 网络配置（与语义版本相同）
network_g:
  type: UNet
  params:
    in_channels: 3
    out_channels: 3
    model_channels: 160
    attention_resolutions: [16, 8]
    num_res_blocks: 2
    channel_mult: [1, 2, 2, 4]
    num_head_channels: 32
    cond_lq: true

network_mse:
  type: SwinIR
  params:
    upscale: 4
    in_chans: 3
    img_size: 64
    window_size: 8
    img_range: 1.0
    depths: [6, 6, 6, 6, 6, 6]
    embed_dim: 180
    num_heads: [6, 6, 6, 6, 6, 6]
    mlp_ratio: 2
    upsampler: pixelshuffle
    resi_connection: 1conv
  ckpt:
    path: /path/to/swinir_pretrained.pth
    param_key_mse: params_ema
    strict_load_mse: true

diffusion:
  beta_schedule: linear
  beta_start: 0.0001
  beta_end: 0.02
  num_diffusion_timesteps: 1000
  un: 1.0
  min_noise: 0.2
  timestep_respacing: ddim50
  one_step: false

# ⚠️ 关键区别：不使用预训练语义编码器
uncertainty_mapping:
  use_learnable: true
  type: content_aware
  
  # 🔴 禁用预训练语义编码器（baseline）
  use_pretrained_semantic: false  # false表示不使用CLIP/DeiT
  
  hidden_channels: 64
  num_heads: 4
  window_size: 8
  
  staged_training: false
  freeze_others_initially: false
  lr_scale: 1.0
  ckpt_path: ~
  strict_load: true

# 训练配置（与语义版本相同）
train:
  ema_decay: 0.999
  
  optim_g:
    type: AdamW
    lr: !!float 1e-4
    weight_decay: 0.01
    betas: [0.9, 0.999]
  
  scheduler:
    type: MultiStepLR
    milestones: [100000, 200000, 300000]
    gamma: 0.5
  
  total_iter: 400000
  warmup_iter: -1
  
  guidance_loss_weight: 0
  
  perceptual_opt:
    lpips_weight: 0.1
  
  use_fp16: false
  
  logger:
    print_freq: 100
    save_checkpoint_freq: !!float 5e3
    use_tb_logger: true
    wandb:
      project: ~
      resume_id: ~
  
  val:
    val_freq: !!float 5e3
    save_img: true
    
    metrics:
      psnr:
        type: calculate_psnr
        crop_border: 4
        test_y_channel: true
        fr: true
      ssim:
        type: calculate_ssim
        crop_border: 4
        test_y_channel: true
        fr: true
      lpips:
        type: calculate_lpips
        fr: true
      niqe:
        type: calculate_niqe
        fr: false

# 退化配置
degradation:
  scale: 4
  gt_size: 256
  resize_prob: [0.2, 0.7, 0.1]
  resize_range: [0.15, 1.5]
  gaussian_noise_prob: 0.5
  noise_range: [1, 30]
  poisson_scale_range: [0.05, 3]
  gray_noise_prob: 0.4
  jpeg_range: [30, 95]
  second_blur_prob: 0.8
  resize_prob2: [0.3, 0.4, 0.3]
  resize_range2: [0.3, 1.2]
  gaussian_noise_prob2: 0.5
  noise_range2: [1, 25]
  poisson_scale_range2: [0.05, 2.5]
  gray_noise_prob2: 0.4
  jpeg_range2: [30, 95]
  use_sharp: false
  blur_kernel_size: 21
  kernel_list: ['iso', 'aniso', 'generalized_iso', 'generalized_aniso', 'plateau_iso', 'plateau_aniso']
  kernel_prob: [0.45, 0.25, 0.12, 0.03, 0.12, 0.03]
  sinc_prob: 0.1
  blur_sigma: [0.2, 3]
  betag_range: [0.5, 4]
  betap_range: [1, 2]

high_order_degradation: true
queue_size: 160

path:
  pretrain_network_g: ~
  strict_load_g: false
  resume_state: ~
  experiments_root: ./experiments
  models: experiments/models
  training_states: experiments/training_states
  log: experiments
  visualization: experiments/visualization

val:
  val_freq: !!float 5e3
  save_img: true
  
  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 4
      test_y_channel: true
      fr: true
    ssim:
      type: calculate_ssim
      crop_border: 4
      test_y_channel: true
      fr: true
    lpips:
      type: calculate_lpips
      fr: true

dist_params:
  backend: nccl
  port: 29500
