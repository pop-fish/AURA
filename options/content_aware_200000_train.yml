# ============================================================
# 内容感知不确定度映射 - 示例配置
# ============================================================
# 使用LQ图像通过Cross-Attention调制不确定度估计

name: content_aware_200000
model_target: basicsr.models.upsr_real_model.UPSRRealModel
scale: 4
num_gpu: 2
manual_seed: 0
queue_size: 160

# ============================================================
# 核心配置：内容感知映射
# ============================================================
uncertainty_mapping:
  use_learnable: true
  type: content_aware  # ✅ 使用新的内容感知映射
  
  # 内容感知映射特有参数
  hidden_channels: 64      # 特征提取隐藏层通道数（默认64）
  num_heads: 4             # Cross-Attention头数（默认4）
  window_size: 8           # 窗口注意力大小（内存优化）
  
  # ============================================================
  # 阶段1训练策略：冻结主网络，只训练映射器
  # ============================================================
  staged_training: true
  freeze_main_network: true   # ✅ 冻结主网络net_g，只训练uncertainty_mapper
  freeze_others_initially: true  # 确保其他模块也被冻结
  
  # 学习率配置
  mapper_lr_scale: 1.0        # 映射层使用基础学习率
  main_lr_scale: 0.1          # 主网络学习率倍数（虽然冻结了，但保留配置）
  
  # 不加载预训练映射层（从初始化开始训练）
  ckpt_path: ~
  strict_load: true

# ============================================================
# 数据集配置
# ============================================================
datasets:
  train:
    name: ImageNet
    type: RealESRGANDataset
    dataroot_gt: /dataset/ImageNet/ILSVRC2012_TRAIN/train
    meta_info_file: basicsr/data/meta_info/meta_info_ImageNet_GT_correct.txt
    filename_tmpl: '{}'
    io_backend:
      type: disk
    
    mean: 0.5
    std: 0.5

    blur_kernel_size: 21
    kernel_list: ['iso', 'aniso', 'generalized_iso', 'generalized_aniso', 'plateau_iso', 'plateau_aniso']
    kernel_prob: [0.45, 0.25, 0.12, 0.03, 0.12, 0.03]
    sinc_prob: 0.1
    blur_sigma: [0.2, 3]
    betag_range: [0.5, 4]
    betap_range: [1, 2]

    blur_kernel_size2: 15
    kernel_list2: ['iso', 'aniso', 'generalized_iso', 'generalized_aniso', 'plateau_iso', 'plateau_aniso']
    kernel_prob2: [0.45, 0.25, 0.12, 0.03, 0.12, 0.03]
    sinc_prob2: 0.1
    blur_sigma2: [0.2, 1.5]
    betag_range2: [0.5, 4]
    betap_range2: [1, 2]

    final_sinc_prob: 0.8

    gt_size: 256
    rescale_gt: false
    crop_pad_size: 256
    use_hflip: true
    use_rot: true

    num_worker_per_gpu: 6
    batch_size_per_gpu: 16
    micro_batchsize: 16
    dataset_enlarge_ratio: 1
    prefetch_mode: cuda
    pin_memory: true
    persistent_workers: true

  val_1:
    name: imagenet256
    type: PairedImageDataset
    dataroot_gt: /dataset/ImageNet/imagenet256/gt
    dataroot_lq: /dataset/ImageNet/imagenet256/lq
    io_backend:
      type: disk
    batch_size: 32

# ============================================================
# 退化配置
# ============================================================
degradation:
  scale: 4
  resize_prob: [0.2, 0.7, 0.1]
  resize_range: [0.15, 1.5]
  gaussian_noise_prob: 0.5
  noise_range: [1, 30]
  poisson_scale_range: [0.05, 3.0]
  gray_noise_prob: 0.4
  jpeg_range: [30, 95]

  second_order_prob: 0.5
  second_blur_prob: 0.8
  resize_prob2: [0.3, 0.4, 0.3]
  resize_range2: [0.3, 1.2]
  gaussian_noise_prob2: 0.5
  noise_range2: [1, 25]
  poisson_scale_range2: [0.05, 2.5]
  gray_noise_prob2: 0.4
  jpeg_range2: [30, 95]

  gt_size: 256
  resize_back: false
  use_sharp: false

# ============================================================
# 网络结构
# ============================================================
network_g:
  target: basicsr.archs.swin_unet_arch.UNetModelSwin
  params:
    image_size: 64
    in_channels: 48
    model_channels: 160
    out_channels: 3
    attention_resolutions: [64,32,16,8]
    dropout: 0
    channel_mult: [1, 2, 2, 4]
    num_res_blocks: [2, 2, 2, 2]
    conv_resample: true
    dims: 2
    use_fp16: false
    num_head_channels: 32
    use_scale_shift_norm: true
    resblock_updown: false
    swin_depth: 2
    swin_embed_dim: 192
    window_size: 8
    mlp_ratio: 4
    cond_lq: true
    lq_size: 64
    num_feat: 128

diffusion:
  un: 0.1
  min_noise: 0.4
  target: models.script_util.create_gaussian_diffusion
  params:
    sf: 4
    schedule_name: exponential
    schedule_kwargs:
      power: 0.2
    etas_end: 0.99
    steps: 5
    min_noise_level: 0.2
    kappa: 2.5
    weighted_mse: false
    predict_type: xstart
    timestep_respacing: ~
    scale_factor: 1.0
    normalize_input: true
    latent_flag: false

network_mse:
  target: basicsr.archs.atd_real_arch.ATD
  ckpt: 
    path: experiments/pretrained_models/atd_real.pth
    strict_load_mse: true
    param_key_mse: params_ema
  params:
    upscale: 4
    in_chans: 3
    img_size: 64
    embed_dim: 96
    depths: [6, 6, 6, 6]
    num_heads: [4, 4, 4, 4]
    window_size: 16
    category_size: 128
    num_tokens: 64
    reducted_dim: 8
    convffn_kernel_size: 7
    img_range: 1.
    mlp_ratio: 1
    upsampler: 'pixelshuffledirect'
    resi_connection: '1conv'
    use_checkpoint: false

# ============================================================
# 模型路径
# ============================================================
path:
  pretrain_network_g: experiments/pretrained_models/upsr.pth
  strict_load_g: true
  resume_state: ~

# ============================================================
# 训练配置（阶段1：只训练映射器）
# ============================================================
train:
  use_fp16: true
  ema_decay: 0  # ✅ 不使用EMA，因为只训练映射层
  
  optim_g:
    type: AdamW
    lr: !!float 2e-4  # 基础学习率（映射器专用）
    weight_decay: 0.0005
    betas: [0.9, 0.999]
  
  scheduler:
    type: TrueCosineAnnealingLR
    T_max: 10000
    eta_min: !!float 1e-5

  total_iter: 10000  # ✅ 阶段1训练10k次
  warmup_iter: 500

  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
    reduction: mean

  perceptual_opt:
    lpips_weight: 0.5

# ============================================================
# 验证配置（阶段1：更频繁验证）
# ============================================================
val:
  val_freq: 1000  # ✅ 每1000次验证一次（更频繁监控）
  suffix: ~
  save_img: false  # ✅ 不保存图像，加快验证速度
  pbar: true
  desired_min_size: 64
  chop_size: 512
  chop_stride: 448
  chop_bs: 1
  noise_repeat: false

  metrics:
    psnr:
      fr: true
    ssim:
      fr: true
    lpips:
      fr: true
      better: lower

# ============================================================
# 日志配置（阶段1：更频繁保存checkpoint）
# ============================================================
logger:
  print_freq: 100
  save_checkpoint_freq: !!float 1e3  # ✅ 每1000次保存一次
  use_tb_logger: true
  wandb:
    project: ~
    resume_id: ~

# 分布式训练设置
dist_params:
  backend: nccl
  port: 29500
