# 🔥 带语义引导的AURA训练配置
# 使用预训练CLIP/DeiT编码器提取语义特征，指导不确定度映射

name: AURA_semantic_guided
model_target: basicsr.models.upsr_real_model.UPSRRealModel
scale: 4
num_gpu: 2
manual_seed: 0
queue_size: 168

# 数据集配置
datasets:
  train:
    name: ImageNet
    type: RealESRGANDataset
    dataroot_gt: /dataset/ImageNet/ILSVRC2012_TRAIN/train
    meta_info_file: basicsr/data/meta_info/meta_info_ImageNet_GT_correct.txt
    filename_tmpl: '{}'
    io_backend:
      type: disk
    
    mean: 0.5
    std: 0.5

    blur_kernel_size: 21
    kernel_list: ['iso', 'aniso', 'generalized_iso', 'generalized_aniso', 'plateau_iso', 'plateau_aniso']
    kernel_prob: [0.45, 0.25, 0.12, 0.03, 0.12, 0.03]
    sinc_prob: 0.1
    blur_sigma: [0.2, 3]
    betag_range: [0.5, 4]
    betap_range: [1, 2]

    blur_kernel_size2: 15
    kernel_list2: ['iso', 'aniso', 'generalized_iso', 'generalized_aniso', 'plateau_iso', 'plateau_aniso']
    kernel_prob2: [0.45, 0.25, 0.12, 0.03, 0.12, 0.03]
    sinc_prob2: 0.1
    blur_sigma2: [0.2, 1.5]
    betag_range2: [0.5, 4]
    betap_range2: [1, 2]

    final_sinc_prob: 0.8

    gt_size: 256
    rescale_gt: false
    crop_pad_size: 256
    use_hflip: true
    use_rot: true

    num_worker_per_gpu: 8  # 🔥 增加worker提升数据加载速度
    batch_size_per_gpu: 28  # 🔥 从16增加到32，充分利用显存
    micro_batchsize: 28     # 🔥 保持与batch_size一致，避免梯度累积
    dataset_enlarge_ratio: 1
    prefetch_mode: cuda
    pin_memory: true
    persistent_workers: true

  val_1:
    name: imagenet256
    type: PairedImageDataset
    dataroot_gt: /dataset/ImageNet/imagenet256/gt
    dataroot_lq: /dataset/ImageNet/imagenet256/lq
    io_backend:
      type: disk
    batch_size: 32

# 网络配置
network_g:
  target: basicsr.archs.swin_unet_arch.UNetModelSwin
  params:
    image_size: 64
    in_channels: 48
    model_channels: 160
    out_channels: 3
    attention_resolutions: [64,32,16,8]
    dropout: 0
    channel_mult: [1, 2, 2, 4]
    num_res_blocks: [2, 2, 2, 2]
    conv_resample: true
    dims: 2
    use_fp16: false
    num_head_channels: 32
    use_scale_shift_norm: true
    resblock_updown: false
    swin_depth: 2
    swin_embed_dim: 192
    window_size: 8
    mlp_ratio: 4
    cond_lq: true
    lq_size: 64
    num_feat: 128

diffusion:
  un: 0.1
  min_noise: 0.2  # 🔥 提升底噪到0.2，避免过度平滑
  target: models.script_util.create_gaussian_diffusion
  params:
    sf: 4
    schedule_name: exponential
    schedule_kwargs:
      power: 0.2
    etas_end: 0.99
    steps: 5
    min_noise_level: 0.2
    kappa: 2.5
    weighted_mse: false
    predict_type: xstart
    timestep_respacing: ~
    scale_factor: 1.0
    normalize_input: true
    latent_flag: false

# 辅助MSE网络（冻结）
network_mse:
  target: basicsr.archs.atd_real_arch.ATD
  ckpt: 
    path: experiments/pretrained_models/atd_real.pth
    strict_load_mse: true
    param_key_mse: params_ema
  params:
    upscale: 4
    in_chans: 3
    img_size: 64
    embed_dim: 96
    depths: [6, 6, 6, 6]
    num_heads: [4, 4, 4, 4]
    window_size: 16
    category_size: 128
    num_tokens: 64
    reducted_dim: 8
    convffn_kernel_size: 7
    img_range: 1.
    mlp_ratio: 1
    upsampler: 'pixelshuffledirect'
    resi_connection: '1conv'
    use_checkpoint: false


# 🔥 可学习的不确定度映射配置（关键改进）
uncertainty_mapping:
  use_learnable: true
  type: content_aware  # 'mlp', 'spatial', or 'content_aware'
  
  # 🌟 语义编码器配置
  use_pretrained_semantic: true  # 启用预训练语义编码器
  semantic_model: clip  # 'clip' 或 'deit'
  # clip: CLIP-ViT-B/32 (需要transformers库)
  # deit: DeiT-tiny (需要timm库)
  
  # 网络架构参数
  hidden_channels: 64  # 隐藏层通道数
  num_heads: 4  # Cross-Attention头数
  window_size: 8  # 窗口注意力的窗口大小
  
  # 训练策略
  staged_training: false  # 是否分阶段训练（第一阶段只训练mapper）
  freeze_main_network: true  # 🔥 冻结主网络（使用预训练权重）
  freeze_others_initially: false

  mapper_lr_scale: 1.0        # 映射层使用基础学习率
  main_lr_scale: 1.0    # 主网络学习率缩放因子
  
  # 预训练权重（可选）
  ckpt_path: ~  # 如果有预训练的mapper权重，填写路径
  strict_load: true

# 训练配置
train:
  use_fp16: true  # 🔥 启用混合精度训练
  ema_decay: 0.999
  
  # 总训练步数
  total_iter: 100000
  warmup_iter: 500  # warmup 500次
  
  optim_g:
    type: AdamW
    lr: !!float 2e-4
    weight_decay: 0.0005
    betas: [0.9, 0.999]
  
  scheduler:
    type: TrueCosineAnnealingLR
    T_max: 100000
    eta_min: !!float 1e-5
  
  # 🔥 语义引导的约束损失（对比学习 + 弱回归）
  guidance_loss_weight: 0.05  # Guidance Loss 总权重
  contrast_weight: 1.0  # 对比学习权重（相对值）
  regression_weight: 0.3  # 弱回归权重（相对值）
  diff_gt_mode: 'max'  # 'bicubic', 'sr', 'max', 'weighted'
  bicubic_weight: 0.7  # 仅在 weighted 模式使用

  # 基础损失
  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
    reduction: mean

  perceptual_opt:
    lpips_weight: 0.5
  
  # 日志和保存
  logger:
    print_freq: 100
    save_checkpoint_freq: !!float 5e3
    use_tb_logger: true
    wandb:
      project: ~
      resume_id: ~
  
  val:
    val_freq: !!float 5e3
    save_img: true
    save_diff_heatmap: false  # 不保存 Diff 热力图（加快验证速度）
    save_uncertainty_heatmap: false  # 不保存 Uncertainty 热力图
    
    desired_min_size: 64
    chop_size: 512
    chop_stride: 448
    chop_bs: 1
    noise_repeat: false
    pbar: true
    
    metrics:
      # 传统指标作为参考
      psnr:
        fr: true
        better: higher
      
      ssim:
        fr: true
        better: higher

      lpips:
        fr: true
        better: lower
      
      clipiqa:
        fr: false
        better: higher
      
      musiq:
        fr: false  
        better: higher
      
      niqe:
        fr: false
        better: lower
      
      

# 退化配置（Real-ESRGAN风格）
degradation:
  scale: 4
  resize_prob: [0.2, 0.7, 0.1]
  resize_range: [0.15, 1.5]
  gaussian_noise_prob: 0.5
  noise_range: [1, 30]
  poisson_scale_range: [0.05, 3.0]
  gray_noise_prob: 0.4
  jpeg_range: [30, 95]

  second_order_prob: 0.5
  second_blur_prob: 0.8
  resize_prob2: [0.3, 0.4, 0.3]
  resize_range2: [0.3, 1.2]
  gaussian_noise_prob2: 0.5
  noise_range2: [1, 25]
  poisson_scale_range2: [0.05, 2.5]
  gray_noise_prob2: 0.4
  jpeg_range2: [30, 95]

  gt_size: 256
  resize_back: false
  use_sharp: false

high_order_degradation: true

# 路径配置
path:
  pretrain_network_g: experiments/pretrained_models/upsr.pth
  strict_load_g: true
  param_key_g: params_ema  # 使用EMA参数
  resume_state: ~  # 不恢复训练状态，从头开始训练mapper
  
  # 新的实验目录
  experiments_root: experiments/AURA_semantic_guided
  models: experiments/AURA_semantic_guided/models
  training_states: experiments/AURA_semantic_guided/training_states
  log: experiments/AURA_semantic_guided
  visualization: experiments/AURA_semantic_guided/visualization

# 验证配置
val:
  val_freq: !!float 5e3
  save_img: true
  save_diff_heatmap: false  # 不保存 Diff 热力图（加快验证速度）
  save_uncertainty_heatmap: false  # 不保存 Uncertainty 热力图
  
  desired_min_size: 64
  chop_size: 512
  chop_stride: 448
  chop_bs: 1
  noise_repeat: false
  pbar: true
  
  metrics:
    lpips:
      fr: true
      better: lower
    
    clipiqa:
      fr: false
      better: higher
    
    musiq:
      fr: false  
      better: higher
    
    niqe:
      fr: false
      better: lower
    
    # 传统指标作为参考
    psnr:
      fr: true
      better: higher
    
    ssim:
      fr: true
      better: higher

# 日志配置
logger:
  print_freq: 100
  save_checkpoint_freq: !!float 5e3
  use_tb_logger: true
  wandb:
    project: ~
    resume_id: ~

# 分布式训练
dist_params:
  backend: nccl
  port: 29500
